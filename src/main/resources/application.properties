spring.application.name=DuoEnglish
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=english_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234567890

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# JWT Configuration
jwt.secret=YourSecretKeyForJWTTokenGenerationMustBeLongEnough
jwt.expiration=86400000

# Azure Storage Configuration
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=duoenglish-media

# Server Configuration
server.port=8080
spring.security.user.name=admin
spring.security.user.password=admin