# Production Configuration for Azure
spring.application.name=DuoEnglish

# Azure SQL Database
spring.datasource.url=${AZURE_SQL_URL}
spring.datasource.username=${AZURE_SQL_USERNAME}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Azure Redis Cache
spring.data.redis.host=${AZURE_REDIS_HOST}
spring.data.redis.port=6380
spring.data.redis.password=${AZURE_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=60000

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Azure Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=duoenglish-media

# Server Configuration
server.port=8080
